<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 转换器演示 · py2ts</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0a0c14; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      #status {
        position: fixed; top: 10px; left: 14px; z-index: 10;
        font: 13px/1.4 ui-monospace, "Cascadia Mono", monospace; color: #9aa6b8;
        background: rgba(10, 12, 20, 0.6); padding: 5px 9px; border-radius: 5px;
        pointer-events: none; max-width: 70vw;
      }
      #reload {
        position: fixed; top: 10px; right: 14px; z-index: 10;
        font: 13px ui-monospace, monospace; color: #dfe6f0; background: #1b2740;
        border: 1px solid #2b3a52; padding: 6px 14px; border-radius: 5px; cursor: pointer;
      }
      #reload:hover { background: #243352; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="status">加载中…</div>
    <button id="reload">重跑</button>
    <script type="module" src="/src/demo/standalone.ts"></script>
  </body>
</html>
